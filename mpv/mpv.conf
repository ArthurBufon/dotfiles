# ============================================================
# MPV - Anime configuration
# Debian 13
# ============================================================


# ------------------------------------------------------------
# VIDEO
# ------------------------------------------------------------

# Rendering moderno do MPV
vo=gpu-next

# Hardware decoding automático
hwdec=auto-safe

# Boa qualidade de scaling
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Melhor downscaling
dscale=mitchell

# Reduz ringing causado pelo scaling
scale-antiring=0.7

# Mantém dithering automático
dither-depth=auto


# ------------------------------------------------------------
# ANIME / IMAGE QUALITY
# ------------------------------------------------------------

# NÃO usar interpolation.
# Mantém os 23.976 / 24 FPS originais do anime.
interpolation=no

# Debanding desligado por padrão.
# Ative somente quando um anime tiver banding visível.
deband=no


# ------------------------------------------------------------
# AUDIO / LANGUAGE
# ------------------------------------------------------------

# Preferir áudio japonês
alang=ja,jpn,jp,en,eng

# Preferir legenda em inglês
slang=en,eng

# ------------------------------------------------------------
# SUBTITLES
# ------------------------------------------------------------

# Mantém styling ASS original das fansubs / releases
sub-ass-override=no

# Busca arquivos de legenda próximos ao vídeo
sub-auto=fuzzy


# ------------------------------------------------------------
# PLAYER
# ------------------------------------------------------------

# Abrir em fullscreen
fullscreen=yes

# Salvar posição quando fechar
save-position-on-quit=yes

# Não fechar imediatamente ao acabar
keep-open=yes

# Ocultar cursor depois de 1 segundo
cursor-autohide=1000

# Screenshot em PNG
screenshot-format=png

# Nome organizado dos screenshots
screenshot-template=~/Pictures/mpv/%F-%P
